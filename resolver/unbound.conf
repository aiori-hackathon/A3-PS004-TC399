server:
    interface: 0.0.0.0
    port: 53
    do-ip4: yes
    do-ip6: no
    do-udp: yes
    do-tcp: yes

    local-zone: "test." transparent

    access-control: 127.0.0.0/8 allow
    access-control: 172.28.0.0/24 allow

    username: "unbound"
    module-config: "validator iterator"
    chroot: ""
    directory: "/"
    pidfile: "/run/unbound/unbound.pid"

    hide-identity: yes
    hide-version: yes
    verbosity: 1
    val-log-level: 2

    # A local test trust anchor is generated from the aegis.test DNSKEY.
    # The parent zone is signed; insecure.aegis.test is delegated without DS.
    trust-anchor-file: "/generated/aegis-trust-anchor.key"

    harden-dnssec-stripped: yes
    val-permissive-mode: no
    qname-minimisation: no
    edns-buffer-size: 1232
    so-reuseport: no

stub-zone:
    name: "aegis.test."
    stub-addr: 172.28.0.10
