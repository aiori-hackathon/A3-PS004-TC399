options {
    directory "/var/cache/bind";
    listen-on { any; };
    listen-on-v6 { none; };
    allow-query { any; };
    allow-recursion { none; };
    recursion no;
    dnssec-validation no;
    allow-transfer { none; };
    minimal-responses yes;
    pid-file "/run/named/named.pid";
};

zone "aegis.test" {
    type primary;
    file "/var/lib/bind/generated/aegis.test.zone";
    allow-update { none; };
};

zone "insecure.aegis.test" {
    type primary;
    file "/var/lib/bind/generated/insecure.aegis.test.zone";
    allow-update { none; };
};
