name: a3-ps004-tc399

services:
  certgen:
    profiles: ["tools"]
    build:
      context: ./tools/certgen
    environment:
      GATEWAY_IP: ${GATEWAY_IP:-127.0.0.1}
    volumes:
      - ./pki:/out

  authoritative:
    build:
      context: ./dns
    restart: unless-stopped
    volumes:
      - ./dns/generated:/var/lib/bind/generated
    networks:
      aegis_net:
        ipv4_address: 172.29.0.10
    expose:
      - "53/udp"
      - "53/tcp"
    healthcheck:
      test: ["CMD-SHELL", "rndc status >/dev/null 2>&1 || dig @127.0.0.1 aegis.test SOA +time=1 +tries=1 >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  resolver:
    build:
      context: ./resolver
    restart: unless-stopped
    volumes:
      - ./dns/generated:/generated:ro
    depends_on:
      authoritative:
        condition: service_started
    networks:
      aegis_net:
        ipv4_address: 172.29.0.20
    expose:
      - "53/udp"
      - "53/tcp"

  gateway:
    build:
      context: ..
      dockerfile: src/gateway/Dockerfile
    restart: unless-stopped
    environment:
      RESOLVER_HOST: "172.29.0.20"
      RESOLVER_PORT: "53"
      METRICS_URL: "http://dashboard:3000/api/metrics"
      TLS_CERT: "/app/certs/server.crt"
      TLS_KEY: "/app/certs/server.key"
      CLIENT_CA: "/app/certs/rootCA.crt"
    volumes:
      - ./pki/server.crt:/app/certs/server.crt:ro
      - ./pki/server.key:/app/certs/server.key:ro
      - ./pki/rootCA.crt:/app/certs/rootCA.crt:ro
    depends_on:
      - resolver
      - dashboard
    ports:
      - "8853:853/tcp"
    networks:
      aegis_net:
        ipv4_address: 172.29.0.30

  dashboard:
    build:
      context: ./dashboard
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    networks:
      aegis_net:
        ipv4_address: 172.29.0.40

  dashboard-html:
    build:
      context: ./dashboard
      dockerfile: Dockerfile.html
    restart: unless-stopped
    depends_on:
      - dashboard
    ports:
      - "127.0.0.1:3000:80"
    networks:
      - aegis_net

networks:
  aegis_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.0.0/24
