name: a3-ps004-tc399

services:
  certgen:
    profiles: ["tools"]
    build:
      context: ./tools/certgen
    environment:
      GATEWAY_IP: ${GATEWAY_IP:-127.0.0.1}
    volumes:
      - ./pki:/out

  authoritative:
    build:
      context: ./dns
    restart: unless-stopped
    volumes:
      - ./dns/generated:/var/lib/bind/generated
    networks:
      aegis_net:
        ipv4_address: 172.29.0.10
    expose:
      - "53/udp"
      - "53/tcp"
    healthcheck:
      test: ["CMD-SHELL", "rndc status >/dev/null 2>&1 || dig @127.0.0.1 aegis.test SOA +time=1 +tries=1 >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  resolver:
    build:
      context: ./resolver
    restart: unless-stopped
    volumes:
      - ./dns/generated:/generated:ro
    ports:
      - "127.0.0.1:15353:53/udp"
      - "127.0.0.1:15353:53/tcp"
    depends_on:
      authoritative:
        condition: service_started
    networks:
      aegis_net:
        ipv4_address: 172.29.0.20
    expose:
      - "53/udp"
      - "53/tcp"

  gateway:
    build:
      context: ..
      dockerfile: src/gateway/Dockerfile
    restart: unless-stopped
    environment:
      RESOLVER_HOST: "172.29.0.20"
      RESOLVER_PORT: "53"
      METRICS_URL: "http://dashboard:3000/api/metrics"
      TLS_CERT: "/app/certs/server.crt"
      TLS_KEY: "/app/certs/server.key"
      CLIENT_CA: "/app/certs/rootCA.crt"
      APNIC_DB_PATH: "/data/apnic/apnic.db"
    volumes:
      - ./pki/server.crt:/app/certs/server.crt:ro
      - ./pki/server.key:/app/certs/server.key:ro
      - ./pki/rootCA.crt:/app/certs/rootCA.crt:ro
      - ../data/apnic:/data/apnic:ro
    depends_on:
      - resolver
      - dashboard
    ports:
      - "8853:853/tcp"
    networks:
      aegis_net:
        ipv4_address: 172.29.0.30

  mongodb:
    image: mongo:7.0.14
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-aegisdns}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-change-me-local-only}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-aegisdns}
    volumes:
      - mongodb_data:/data/db
    networks:
      aegis_net:
        ipv4_address: 172.29.0.50
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\" | grep -q 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  dashboard:
    build:
      context: ./dashboard
    restart: unless-stopped
    environment:
      MONGO_HOST: mongodb
      MONGO_PORT: "27017"
      MONGO_USER: ${MONGO_USER:-aegisdns}
      MONGO_PASSWORD: ${MONGO_PASSWORD:-change-me-local-only}
      MONGO_DB: ${MONGO_DB:-aegisdns}
      RETENTION_DAYS: ${RETENTION_DAYS:-30}
      APNIC_DB_PATH: "/data/apnic/apnic.db"
      APNIC_STATUS_PATH: "/data/apnic/sync_status.json"
    volumes:
      - ../data/apnic:/data/apnic:ro
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "127.0.0.1:3001:3000"
    networks:
      aegis_net:
        ipv4_address: 172.29.0.40

  apnic-updater:
    build:
      context: ..
      dockerfile: src/apnic/Dockerfile
    restart: unless-stopped
    environment:
      APNIC_DATA_DIR: "/data/apnic"
      APNIC_DB_PATH: "/data/apnic/apnic.db"
      APNIC_UPDATE_INTERVAL_HOURS: "${APNIC_UPDATE_INTERVAL_HOURS:-24}"
      APNIC_GPG_FINGERPRINT: "${APNIC_GPG_FINGERPRINT:-}"
      PYTHONUNBUFFERED: "1"
    volumes:
      - ../data/apnic:/data/apnic
    networks:
      aegis_net:
        ipv4_address: 172.29.0.60

  dashboard-html:
    build:
      context: ./dashboard
      dockerfile: Dockerfile.html
    restart: unless-stopped
    depends_on:
      - dashboard
    ports:
      - "127.0.0.1:3000:80"
    networks:
      - aegis_net

  # Optional NETWORK-mode smoke test & test-run recorder (run with: --profile tools run --rm gateway-tester)
  gateway-tester:
    profiles: ["tools"]
    image: python:3.12-slim
    working_dir: /app
    command: ["python", "/app/scripts/test_gateway.py"]
    environment:
      GATEWAY_HOST: "gateway"
      GATEWAY_PORT: "853"
      GATEWAY_TLS_SERVERNAME: "${GATEWAY_IP:-127.0.0.1}"
      METRICS_URL: "http://dashboard:3000/api/metrics"
      DASHBOARD_URL: "http://dashboard:3000"
      PKI_DIR: "/app/pki"
    volumes:
      - ./scripts:/app/scripts:ro
      - ./pki:/app/pki:ro
    depends_on:
      - gateway
      - dashboard
    networks:
      - aegis_net

  # Optional Linux/Raspberry Pi USB serial bridge (NOT default; does not work on Docker Desktop for Windows/macOS).
  # Run on Linux edge nodes with: --profile serial-linux up -d serial-bridge
  serial-bridge:
    profiles: ["serial-linux"]
    build:
      context: ./tools
      dockerfile: serial-bridge/Dockerfile
    restart: unless-stopped
    environment:
      SERIAL_PORT: "${SERIAL_DEVICE:-/dev/ttyUSB0}"
      SERIAL_BAUD: "${SERIAL_BAUD:-115200}"
      DASHBOARD_URL: "http://dashboard:3000"
      DEVICE_ID: "${DEVICE_ID:-unknown}"
    devices:
      - "${SERIAL_DEVICE:-/dev/ttyUSB0}:${SERIAL_DEVICE:-/dev/ttyUSB0}"
    depends_on:
      - dashboard
    networks:
      - aegis_net

networks:
  aegis_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.0.0/24

volumes:
  mongodb_data:
